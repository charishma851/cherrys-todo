<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Diary</title>
  <link rel="stylesheet" href="diary.css">
  <link rel="stylesheet" href="theme.css"/>
</head>

<body>

<div class="container">
   
  <h1 class="title">My Diary 📖💗</h1>
  <p class="subtitle">Write your heart out, beautiful ✨</p>

  <div class="dateBox">
      <label>Select Date:</label>
      <input type="date" id="dateInput">
  </div>

  <textarea id="diaryText" placeholder="How was your day? Write your thoughts, feelings, rants, wins... anything you want 🥺💖"></textarea>

  <div class="buttons">
      <button onclick="saveDiary()">Save Entry ✨</button>
      <button onclick="clearDiary()">Clear ❌</button>
  </div>

  <h2 class="title2">Saved Entries 🌷</h2>
  <ul id="entriesList"></ul>

  <a href="dashboard.html" class="backBtn">⬅ Back to Dashboard</a>

</div>

<script src="diary.js"></script>
<script src="theme.js"></script>
</body>
</html>
